replicaCount: 1

image: "ghcr.io/sparebankenvest/ingress2acmebotreflector:0.1.13"
backendURL: "https://func-keyvault-acme-bot-dev.azurewebsites.net" # https://func-keyvault-acme-bot-prod.azurewebsites.net
azureClientId: "xxxx-xxxx-xxxx-xxx-xxxx"
apiScope: "api://keyvault-acme-bot-dev" # api://keyvault-acme-bot-prod
domains: "spvdev.no" # spv.no for prod workloads. Comma separated list.
acmebot_rest_api_timeout: "60" # Timeout for the ACME bot REST API calls.

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podLabels: {}

containerPort: 8081 # Port used for liveness/readiness probes.

# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, adjust them as necessary.
resources:
  requests:
    cpu: 10m

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
