name: Publish Docker Image and GitHub Release on Merge to main

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for creating releases/tags
      packages: write  # for pushing to ghcr
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Compute image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(yq '.appVersion' config/charts/ingress2acmebotreflector/Chart.yaml)"
          echo "tag=$app_version" >> "$GITHUB_OUTPUT"
          echo "Release image tag: $app_version"

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔎 Check if image tag already exists
        id: exists
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          if docker manifest inspect "ghcr.io/sparebankenvest/ingress2acmebotreflector:${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image tag ${tag} already published; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image tag ${tag} is new; will publish."
          fi

      - name: 🏗️ Set up QEMU
        if: ${{ steps.exists.outputs.exists == 'false' }}
        uses: docker/setup-qemu-action@v3
      - name: 🏗️ Set up Docker Buildx
        if: ${{ steps.exists.outputs.exists == 'false' }}
        uses: docker/setup-buildx-action@v3

      - name: 📦 Build and push Docker image
        if: ${{ steps.exists.outputs.exists == 'false' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sparebankenvest/ingress2acmebotreflector:${{ steps.meta.outputs.tag }}

      - name: 🏷️ Create git tag
        if: ${{ steps.exists.outputs.exists == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

      - name: 🕊️ Create GitHub Release
        if: ${{ steps.exists.outputs.exists == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
