name: Lint and test helmchart

on:
  pull_request:
    branches:
      - main

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure image tag defaults to appVersion (no drift)
        shell: bash
        run: |
          chart_dir="config/charts/ingress2acmebotreflector"
          # image.tag must stay empty so the deployed image tracks Chart.yaml appVersion.
          tag="$(yq '.image.tag' "$chart_dir/values.yaml")"
          if [[ "$tag" != "" && "$tag" != "null" ]]; then
            echo "::error file=$chart_dir/values.yaml::image.tag is pinned to '$tag'. Leave it empty so the image tracks Chart.yaml appVersion, then bump appVersion instead."
            exit 1
          fi
          echo "OK: image.tag is empty; image tracks appVersion."

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.22.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        shell: bash
        # If there are changes, put a comma separated list of `chart/<chart-name>` as output
        run: |
          changed=$(ct list-changed --config ct.yml)
          if [[ -n "$changed" ]]; then
            changed_charts=$(echo $changed | tr ' ' ',')
            echo "changed_charts=$changed_charts" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint chart
        if: ${{ steps.list-changed.outputs.changed_charts != null }}
        run: ct lint --config ct.yml

      - name: Create Kubernetes Kind cluster
        uses: helm/kind-action@v1.9.0
        if: ${{ steps.list-changed.outputs.changed_charts != null }}

      # Run chart tests for changed charts, excluding svai-system
      - name: Run chart-testing (install)
        run: ct install --config ct.yml
        if: ${{ steps.list-changed.outputs.changed_charts != null }}
